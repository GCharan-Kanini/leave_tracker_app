stack: python-pytest
install_cmd: pip install -r requirements.in
syntax_cmd: python -c "from pathlib import Path; [compile(path.read_text(encoding='utf-8'),
  str(path), 'exec') for path in Path('.').rglob('*.py') if '.venv' not in path.parts]"
build_cmd: python -m compileall -q .
test_cmd: python -m pytest -q
test_selector: python -m pytest -q {path}
dependency_file: requirements.in
runtime_version: '3.11'
